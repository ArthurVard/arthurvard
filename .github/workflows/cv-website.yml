# Builds the CV from cv/Arthur_Vardanyan_CV.yaml and publishes the web page and its PDF
# to GitHub Pages: https://arthurvard.github.io/arthurvard/
#
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Runs on every push to main that changes cv/ (or this file), and on demand from the Actions tab.

name: CV website

on:
  push:
    branches: [main]
    paths: ["cv/**", ".github/workflows/cv-website.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write # to publish to GitHub Pages
  id-token: write # to prove the publish request comes from this workflow

# One deployment at a time; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: cv/requirements.txt
      # The same command as on your machine. There is no private.yaml here, so no phone number.
      - run: python cv/build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: cv/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
